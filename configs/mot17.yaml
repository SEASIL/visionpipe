camera_id: cam0
source:
  uri: data/MOT17/train/MOT17-04-FRCNN/img1/%06d.jpg

detector:
  type: yolo
  weights: yolov8n.onnx
  providers: [CPUExecutionProvider]  # Run on CPU or GPU? Wait, I'll let config handle it, or specify CUDA. Let's use CUDAExecutionProvider
  conf: 0.25
  classes: [person]

tracker:
  high_thresh: 0.5
  low_thresh: 0.1
  new_track_thresh: 0.6
  max_lost: 30
  min_hits: 3

output:
  mot_txt: outputs/cam0/tracks.txt
