[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionpipe"
version = "0.1.0"
description = "Real-time multi-camera video analytics: detection, tracking and rule-based event generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.16"]
gpu = ["onnxruntime-gpu>=1.16"]
train = ["ultralytics>=8.3", "mlflow>=2.10", "dvc>=3.40", "motmetrics>=1.4", "psutil"]
dev = ["pytest>=7.4", "pytest-cov", "ruff", "onnx", "motmetrics>=1.4"]
sinks = ["requests", "paho-mqtt"]

[project.scripts]
visionpipe = "visionpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E701", "E501", "B905"]
